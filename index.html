<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 Интересные факты о животных</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .name-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 25px;
            color: white;
        }

        .name-box h2 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .animal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .animal-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            flex: 1;
            min-width: 130px;
            font-size: 20px;
            padding: 15px 20px;
        }

        .animal-btn:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .image-container {
            margin: 25px 0;
            border-radius: 20px;
            overflow: hidden;
            background: #f0f0f0;
            min-height: 400px;
            max-height: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            max-height: 550px;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .fact {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 25px;
            border-radius: 20px;
            margin-top: 25px;
            font-size: 1.1em;
            line-height: 1.6;
            color: #2c3e50;
            border-left: 5px solid #667eea;
            text-align: left;
        }

        .hidden {
            display: none;
        }

        .image-placeholder {
            width: 100%;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            border-radius: 15px;
            color: #999;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="step1">
            <div class="name-box">
                <h2>👋 Привет, <span id="name">...</span>!</h2>
                <div>🐕 Добро пожаловать в мир животных! 🐱</div>
            </div>
            <button id="newNameBtn">🎲 Новое имя</button>
            <button id="nextBtn">➡️ Далее →</button>
        </div>

        <div id="step2" class="hidden">
            <h1 style="margin-bottom: 15px;">🐕‍🦺 Кто тебе нравится?</h1>
            <div class="animal-buttons">
                <button class="animal-btn" data-animal="cat">🐱 Кошка</button>
                <button class="animal-btn" data-animal="dog">🐶 Собака</button>
                <button class="animal-btn" data-animal="fox">🦊 Лиса</button>
            </div>
            
            <div class="image-container" id="imageContainer">
                <div class="image-placeholder">🐾 НАЖМИ НА ЖИВОТНОЕ 🐾</div>
            </div>
            
            <div id="factText" class="fact"></div>
        </div>
    </div>

    <script>
        const russianNames = [
            'Александр', 'Дмитрий', 'Максим', 'Артём', 'Иван', 'Михаил', 'Даниил', 'Антон',
            'Анна', 'Мария', 'Екатерина', 'Ольга', 'Татьяна', 'Наталья', 'Ирина', 'Светлана',
            'Сергей', 'Андрей', 'Алексей', 'Владимир', 'Николай', 'Павел', 'Роман',
            'Елена', 'Юлия', 'Анастасия', 'Виктория', 'Ксения', 'Дарья', 'Алиса', 'Полина'
        ];

        const factsDB = {
            cat: [
                "🐱 Кошки спят до 16 часов в день — это примерно две трети их жизни!",
                "🐱 Сердце кошки бьётся почти вдвое быстрее человеческого — 110-140 ударов в минуту.",
                "🐱 Кошки не чувствуют сладкий вкус из-за отсутствия нужных рецепторов.",
                "🐱 Домашние кошки живут в среднем 15 лет, но некоторые доживают до 20 и более.",
                "🐱 Кошка может издавать около 100 различных звуков — для сравнения, собака только 10.",
                "🐱 У кошек отличное ночное зрение — они видят в 6 раз лучше человека в темноте.",
                "🐱 Мурлыканье кошек может способствовать заживлению костей и тканей у человека.",
                "🐱 Самый старый кот в мире прожил 38 лет и 3 дня!",
                "🐱 Усы помогают кошкам определять, пролезут ли они в отверстие.",
                "🐱 Кошки могут поворачивать уши на 180 градусов независимо друг от друга.",
                "🐱 При падении кошки почти всегда приземляются на лапы благодаря вестибулярному аппарату.",
                "🐱 В Древнем Египте кошек считали священными животными."
            ],
            dog: [
                "🐶 Собаки понимают до 250 слов и жестов — примерно как двухлетний ребёнок.",
                "🐶 Нос собаки уникален, как отпечаток пальца у человека.",
                "🐶 Собаки могут чувствовать запахи в 10 000 — 100 000 раз лучше людей.",
                "🐶 Хвост собаки — это индикатор настроения: виляет — радость, поджат — страх.",
                "🐶 Самая быстрая порода собак — грейхаунд, развивает скорость до 70 км/ч.",
                "🐶 Собаки видят мир в оттенках синего и жёлтого, но не различают красный и зелёный.",
                "🐶 Самый маленький пёс в мире весил всего 170 граммов при рождении.",
                "🐶 Собаки могут предсказывать землетрясения и другие природные катастрофы.",
                "🐶 Собачье обоняние настолько тонкое, что они могут обнаружить болезнь.",
                "🐶 У собак есть потовые железы только на подушечках лап.",
                "🐶 Щенки рождаются слепыми, глухими и беззубыми.",
                "🐶 Собаки, как и люди, могут видеть сны."
            ],
            fox: [
                "🦊 Лисы — очень умные животные, они умеют использовать хитрости для добычи еды.",
                "🦊 В дикой природе лисы живут около 3-4 лет, в неволе — до 15 лет.",
                "🦊 Лисы умеют издавать около 40 различных звуков для общения.",
                "🦊 Хвост лисы помогает ей сохранять равновесие и согреваться в холод.",
                "🦊 Лисы могут бегать со скоростью до 50 км/ч и прыгать на расстояние до 2 метров.",
                "🦊 Лиса — частый герой сказок и мифов во многих культурах мира.",
                "🦊 Лисы — родственники собак и волков, они относятся к семейству псовых.",
                "🦊 В Японии есть остров Дзенко, где живут ручные лисы.",
                "🦊 Лисы могут издавать звуки, похожие на лай, визг и даже крик.",
                "🦊 Зимой мех лисы становится гуще и теплее, а лапы покрываются шерстью.",
                "🦊 Лисы отлично лазают по деревьям и даже могут спать на ветках.",
                "🦊 Одна самка лисы рожает от 4 до 12 лисят за раз."
            ]
        };

        const imagesDB = {
            cat: [
                'images/cat1.jpg',
                'images/cat2.jpg', 
                'images/cat3.jpg',
                'images/cat4.jpg',
                'images/cat5.jpg'
            ],
            dog: [
                'images/dog1.jpg',
                'images/dog2.jpg',
                'images/dog3.jpg',
                'images/dog4.webp',
                'images/dog5.jpg'
            ],
            fox: [
                'images/lis1.jpg',
                'images/lis2.jpg',
                'images/lis3.jpg',
                'images/lis4.jpg',
                'images/lis5.png'
            ]
        };

        function getRandomName() {
            return russianNames[Math.floor(Math.random() * russianNames.length)];
        }

        function updateName() {
            document.getElementById('name').textContent = getRandomName();
        }

        function getRandomFact(animal) {
            const facts = factsDB[animal];
            return facts[Math.floor(Math.random() * facts.length)];
        }

        function getRandomImage(animal) {
            const images = imagesDB[animal];
            if (!images || images.length === 0) {
                return null;
            }
            return images[Math.floor(Math.random() * images.length)];
        }

        function showAnimal(animal) {
            const factDiv = document.getElementById('factText');
            const imageContainer = document.getElementById('imageContainer');
            
            const fact = getRandomFact(animal);
            factDiv.innerHTML = `📖 ${fact}`;
            
            const imagePath = getRandomImage(animal);
            if (imagePath) {
                imageContainer.innerHTML = `<img src="${imagePath}" alt="${animal}" onerror="this.parentElement.innerHTML='<div class=\'image-placeholder\'>🖼️ Фото не найдено<br>Положите фото в папку <strong>images/</strong></div>'">`;
            } else {
                imageContainer.innerHTML = `<div class="image-placeholder">🖼️ Нет фото для ${animal}<br>Добавьте фото в папку images/</div>`;
            }
        }

        document.getElementById('newNameBtn').onclick = updateName;
        document.getElementById('nextBtn').onclick = () => {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        };
        
        document.querySelectorAll('.animal-btn').forEach(btn => {
            btn.onclick = () => showAnimal(btn.dataset.animal);
        });
        
        updateName();
    </script>
</body>
</html>
